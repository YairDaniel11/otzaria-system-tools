name: בנייה — גשר + תוספים + קובץ התקנה (Inno Setup)

# שרשרת אספקה (הקשחה): dotnet test חוסם לפני האריזה (גם על push לענפים ועל pull_request, בלי סודות).
# workflow זה רק בונה ובודק: אין בו חתימה ואין Release, ותגית לא מפעילה אותו. שחרור וחתימה נמצאים רק ב-
# release.yml (workflow_dispatch מ-main בלבד, ר' שם), שקורא ל-workflow הזה כ-workflow_call.
# WHY: workflow מופעל מתגית נלקח מה-commit של התגית, כלומר מי שיכול לדחוף תגית שולט בקוד ה-workflow ובבדיקות שבו.
# actions מוצמדים ל-SHA מלא (ההערה ליד כל אחד היא התגית שממנה נלקח). לעדכון: git ls-remote <repo> refs/tags/<tag>.

on:
  push:
    branches:
      - "**"
    paths:
      - "bridge/**"
      - "system-settings/**"
      - "file-explorer/**"
      - "installer/**"
      - "tests/**"
      - "tools/**"
      - "RELEASE_VERSION.txt"
      - ".github/workflows/**"
  # WHY: pull_request (לא pull_request_target): ב-PR מפורק אין גישה לסודות, ו-dotnet test רץ על הקוד של ה-PR
  pull_request: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "ה-commit (SHA מלא) לבנייה, מאומת מראש כאבא-קדמון של main"
        type: string
        required: true
      tag:
        description: "תגית ה-Release (vX.Y.Z), מאומתת מראש"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # נדרש היסטוריה מלאה (לא שכפול רדוד) לחישוב גרסת התוספים למטה

      # גרסת התוספים (file-explorer/system-settings): עצמאית מגרסת הגשר ומגרסת ה-Release, ומסונכרנת
      # בין שני התוספים (לא עצמאית לכל אחד). מחושבת מהיסטוריית git, לא נשמרת/מתעדכנת בקובץ בריפו -
      # כך שאין סיכון ללולאת commit אינסופית (ה-commit של "העלאת גרסה" היה גם הוא נספר כשינוי בתוספים).
      # מתחילה מ-0.2.0 ועולה ב-minor (0.3.0, 0.4.0...) רק כש-file-explorer/system-settings השתנו בפועל
      # מאז BASE_SHA למטה (קומיט לפני השינוי הזה) - אם לא השתנו, נשאר אותו מספר כמו הפעם הקודמת.
      - name: גרסת התוספים
        id: pluginver
        shell: pwsh
        env:
          BASE_SHA: a349071dff9759f51cbe3193313f130d0e80a340
        run: |
          # גרסת התוספים = גרסת הגשר (csproj). מספור 0.x הקודם היה נמוך מ-3.6.0 המותקן ואוצריא סירבה להתקין (שנמוך).
          $ver = ([xml](Get-Content bridge/OtzariaBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$ver" >> $env:GITHUB_OUTPUT

      # מספור ה-Release: שני המקטעים הראשונים (major.minor) נשלטים ע"י RELEASE_VERSION.txt (לעדכן:
      # לערוך ולדחוף); המקטע השלישי (patch) הוא github.run_number - מתקדם אוטומטית בכל push. מחושב
      # מוקדם כי גם קובץ ההתקנה (שם הקובץ + AppVersion) משתמש באותו מספר, לא בגרסת הגשר הפנימית.
      - name: גרסה לתגית ה-Release
        id: ver
        shell: pwsh
        # WHY: ref_name/run_number עוברים דרך env ולא אינטרפולציה ישירה של ${{ }} בתוך הסקריפט
        # (שם תגית כמו v1$(calc) היה מוזרק כקוד pwsh). בנוסף התגית מאומתת בתבנית קפדנית.
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $base = (Get-Content RELEASE_VERSION.txt -Raw).Trim()
          $parts = $base -split '\.'
          $majorMinor = "$($parts[0]).$($parts[1])"
          $full = "$majorMinor.$($env:RUN_NUMBER)"
          # תגית מגיעה רק מ-release.yml (workflow_call, אחרי אימות שה-commit ב-main); בהרצות אחרות התגית היא רק תווית לבנייה
          if ($env:TAG_INPUT) {
            if ($env:TAG_INPUT -notmatch '^v\d{1,4}\.\d{1,4}\.\d{1,6}$') { throw "שם תגית לא תקין: רק vX.Y.Z" }
            $tag = $env:TAG_INPUT; $full = $tag.TrimStart('v')
          } else { $tag = "v$full" }
          "version=$full" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # שער בדיקות: כשל כאן עוצר את הכול (אריזה, Release). מיד אחרי build כדי שכשל קומפילציה יהיה ברור.
      - name: בדיקות (xunit)
        run: dotnet test tests/OtzariaBridge.Tests/OtzariaBridge.Tests.csproj -c Release --nologo

      # כותבים את גרסת התוספים המחושבת (steps.pluginver) לתוך שני המניפסטים לפני האריזה - רק בעותק
      # הזמני שב-runner, לא מחזירים commit לריפו (ר' הסבר אצל חישוב הגרסה למעלה)
      - name: אריזת התוספים כמשאב מוטמע
        shell: pwsh
        env:
          PV: ${{ steps.pluginver.outputs.version }}
        run: |
          $pv = $env:PV
          foreach ($f in @("file-explorer/manifest.json", "system-settings/manifest.json")) {
            (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', ('"version": "' + $pv + '"') | Set-Content $f -Encoding utf8NoBOM -NoNewline
          }
          Get-Content file-explorer/manifest.json | Select-String '"version"'
          Get-Content system-settings/manifest.json | Select-String '"version"'

          New-Item -ItemType Directory -Force bridge/plugins | Out-Null
          Compress-Archive -Path system-settings/* -DestinationPath bridge/plugins/system-settings.zip -Force
          Get-ChildItem file-explorer -Exclude WIP.md | Compress-Archive -DestinationPath bridge/plugins/file-explorer.zip -Force
          Move-Item bridge/plugins/system-settings.zip bridge/plugins/system-settings.otzplugin -Force
          Move-Item bridge/plugins/file-explorer.zip bridge/plugins/file-explorer.otzplugin -Force
          Get-ChildItem bridge/plugins

      - name: Publish
        run: dotnet publish bridge/OtzariaBridge.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out

      # ללא choco בלתי נעול: מורידים גרסה מסוימת ישירות ממאגר הפרויקט ומאמתים SHA256 מוצמד לפני ההרצה.
      # ה-hash חושב מהקובץ הרשמי innosetup-6.4.3.exe (https://github.com/jrsoftware/issrc/releases/tag/is-6_4_3);
      # לאימות עצמאי השוו מול jrsoftware.org לפני שינוי.
      - name: התקנת Inno Setup (גרסה מוצמדת)
        shell: pwsh
        env:
          IS_VERSION: "6.4.3"
          IS_SHA256: f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b
        run: |
          $f = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($env:IS_VERSION -replace '\.','_')/innosetup-$($env:IS_VERSION).exe" -OutFile $f
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:IS_SHA256) { throw "hash של Inno Setup לא תואם: $h" }
          Start-Process $f -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { throw "ISCC.exe לא נמצא אחרי ההתקנה" }

      # AppVersion של קובץ ההתקנה (וגם שם הקובץ עצמו, OtzariaBridge-Setup-{AppVersion}.exe) הוא מספר
      # ה-Release (steps.ver.outputs.version) - לא Program.Version הפנימי - כדי שמה שרואים בשם הקובץ
      # יתאים תמיד למה שרואים בעמוד ה-Releases בגיטהאב.
      - name: בניית קובץ ההתקנה (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$($env:APP_VERSION)" `
            "/DExePath=$PWD\out\OtzariaBridge.exe" `
            "installer\OtzariaBridge.iss"
          Get-ChildItem installer\Output

      # נפרד ממספר ה-Release - UpdateApi.cs בגשר משווה מול הקובץ הזה (גרסת הגשר הפנימית בפועל,
      # OtzariaBridge.csproj) כדי לדעת אם יש עדכון אמיתי לגשר, לא מול מספר ה-Release.
      - name: גרסת הגשר לבדיקת עדכון עצמי
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content bridge/OtzariaBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          Set-Content BRIDGE_VERSION.txt $ver -Encoding ascii -NoNewline

      # SHA256SUMS.txt הוא הקובץ החתום (בג'וב release). השורה הראשונה "# tag=" קושרת אותו להוצאה אחת,
      # וכוללת את BRIDGE_VERSION.txt, כך שגם הגרסה שהגשר משווה מולה חתומה.
      - name: SHA256 לאימות ההורדה
        shell: pwsh
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          # WHY: גרסת מפתח מפורשת (הגשר דוחה keyver חסר או נמוך מ-UpdateApi.MinKeyVersion). בביטול מפתח מעלים כאן ובקוד יחד.
          KEY_VERSION: "1"
        run: |
          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1 -ExpandProperty FullName
          $files = @($setup, "out/OtzariaBridge.exe", "bridge/plugins/system-settings.otzplugin", "bridge/plugins/file-explorer.otzplugin", "BRIDGE_VERSION.txt")
          $lines = @("# tag=$($env:TAG)", "# keyver=$($env:KEY_VERSION)") + (foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) })
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OtzariaBridge-Setup
          path: |
            installer/Output/*.exe
            out/OtzariaBridge.exe
            bridge/plugins/*.otzplugin
            SHA256SUMS.txt
            BRIDGE_VERSION.txt
          if-no-files-found: error
