<!DOCTYPE html>
<html data-plugin-id="com.chadbedera.fileexplorer" lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סייר קבצים</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body>
  <div class="app-shell fx-shell">
    <header class="topbar">
      <h1>סייר קבצים</h1>
      <span id="fx-chip" class="topbar-chip"><i class="dot"></i>מתחבר…</span>
      <span id="fx-temp" class="topbar-chip temp" role="status" aria-live="polite" hidden></span>
      <div class="fx-nav" role="toolbar" aria-label="ניווט">
        <button class="icon-btn" id="fx-back" title="אחורה (Alt+ימינה)" aria-label="אחורה"></button>
        <button class="icon-btn" id="fx-fwd" title="קדימה (Alt+שמאלה)" aria-label="קדימה"></button>
        <button class="icon-btn" id="fx-up" title="תיקייה מעל (Backspace)" aria-label="תיקייה מעל"></button>
        <button class="icon-btn" id="fx-refresh" title="רענון (F5)" aria-label="רענון"></button>
        <button class="icon-btn" id="fx-mode-btn" title="תצוגה" aria-label="תצוגה"></button>
        <button class="icon-btn" id="fx-preview-btn" title="חלונית תצוגה מקדימה" aria-label="חלונית תצוגה מקדימה" aria-pressed="false"></button>
        <button class="icon-btn" id="fx-details-btn" title="חלונית פרטים" aria-label="חלונית פרטים" aria-pressed="false"></button>
        <div class="fx-crumbs" id="fx-crumbs" title="לחיצה כפולה לעריכת הנתיב"></div>
        <form class="fx-search" id="fx-search-form" role="search">
          <span class="fx-search-ic" id="fx-search-ic"></span>
          <input class="input" id="fx-search" type="search" placeholder="חיפוש בתיקייה" title="אפשר להשתמש ב-* וב-?" autocomplete="off" aria-label="חיפוש">
          <button type="button" class="fx-search-clear" id="fx-search-clear" title="ניקוי החיפוש" aria-label="ניקוי החיפוש" hidden></button>
          <label class="fx-content-q check-row" id="fx-content-wrap" hidden><input type="checkbox" id="fx-content"><span class="check-box"></span><span class="check-text">גם בתוכן</span></label>
        </form>
      </div>
      <button class="topbar-btn fx-lang" id="fx-lang" data-noi18n title="Language / שפה" aria-label="Language / שפה">English</button>
      <button class="topbar-btn" id="fx-feedback" title="שליחת הערה" aria-label="שליחת הערה"></button>
      <button class="topbar-btn" id="fx-about" title="אודות" aria-label="אודות"></button>
      <button class="topbar-btn" id="fx-settings" title="הגדרות" aria-label="הגדרות"></button>
      <button class="topbar-btn" id="fx-add-folder" title="הוספת תיקייה" aria-label="הוספת תיקייה" hidden></button>
      <button class="topbar-btn" id="fx-hidden" title="הצגת קבצים מוסתרים" aria-label="הצגת קבצים מוסתרים" aria-pressed="false" hidden></button>
    </header>

    <div class="fx-banner" id="fx-banner" hidden></div>

    <div class="fx-lock" id="fx-lock" aria-live="polite"></div>

    <div class="fx-tabs" id="fx-tabs" role="tablist" aria-label="כרטיסיות"></div>

    <div class="fx-cmds" role="toolbar" aria-label="פעולות" id="fx-cmds"></div>

    <div class="fx-body" id="fx-body">
      <nav class="fx-side" id="fx-side" aria-label="מיקומים"></nav>
      <div class="fx-split" id="fx-split-side" role="separator" aria-orientation="vertical" tabindex="0" title="גררו לשינוי הרוחב (לחיצה כפולה: ברירת מחדל)"></div>
      <main class="fx-main" id="fx-main" tabindex="0" aria-label="רשימת קבצים">
        <div class="fx-head" id="fx-head"></div>
        <div class="fx-libhits" id="fx-libhits" hidden aria-label="ספרים בספריית אוצריא"></div>
        <div class="fx-list" id="fx-list" role="listbox" aria-multiselectable="true"></div>
      </main>
      <div class="fx-split" id="fx-split-prev" role="separator" aria-orientation="vertical" tabindex="0" title="גררו לשינוי הרוחב (לחיצה כפולה: ברירת מחדל)" hidden></div>
      <aside class="fx-preview" id="fx-preview" aria-label="תצוגה מקדימה" hidden></aside>
    </div>

    <footer class="fx-status" id="fx-status"></footer>
  </div>

  <div class="fx-menu" id="fx-menu" role="menu" hidden></div>
  <div id="dialogs"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/lang-en.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/policy.js"></script>
  <script src="js/fallback.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="js/sdk-extras.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/viewers.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/packb.js"></script>
</body>
</html>
